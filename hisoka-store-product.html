<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://fiydbqtjmfwkwkowztxq.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Account — Hisoka Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0a09; --bg-alt:#131211; --panel:#171614;
    --fg:#f1efe9; --muted:#94908a; --faint:#5c5952;
    --line:#2a2825; --line-soft:#201f1c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit; margin:0; padding:0;}
  body{background:var(--bg); color:var(--fg); font-family:'Inter',sans-serif; font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}

  header{position:sticky; top:0; z-index:50; background:rgba(10,10,9,0.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line-soft); padding-top:env(safe-area-inset-top,0px);}
  .nav{display:flex; align-items:center; justify-content:space-between; padding:18px 24px; max-width:1080px; margin:0 auto;}
  .logo{display:flex; align-items:baseline; gap:8px;}
  .logo .word{font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:23px;}
  .logo .sub{font-size:10px; letter-spacing:0.22em; color:var(--muted); border-left:1px solid var(--line); padding-left:8px;}
  .btn-ghost{font-size:14px; color:var(--muted);}
  .btn-ghost:hover{color:var(--fg);}

  .breadcrumb{padding:24px 0 0; font-size:13px; color:var(--muted);}
  .breadcrumb a:hover{color:var(--fg);}

  .product{display:grid; grid-template-columns:1fr 1fr; gap:56px; padding:32px 0 70px; align-items:start;}
  .showcase{aspect-ratio:1/1; background:linear-gradient(135deg,#1c1a17,#0e0d0c); border:1px solid var(--line); position:relative; display:flex; align-items:center; justify-content:center;}
  .showcase .tag{position:absolute; top:16px; left:16px; font-size:11px; letter-spacing:.05em; color:var(--muted); border:1px solid var(--line); padding:5px 10px; background:rgba(10,10,9,.6);}
  .showcase.has-img{aspect-ratio:auto; background:var(--panel); cursor:zoom-in; display:block;}
  .showcase.has-img img{display:block; width:100%; height:auto; max-height:88vh; object-fit:contain;}
  .showcase .zoom-hint{position:absolute; bottom:12px; right:12px; font-size:11px; color:var(--muted); background:rgba(10,10,9,.65); border:1px solid var(--line); padding:5px 10px; border-radius:20px; pointer-events:none;}
  .viewer{position:fixed; inset:0; background:rgba(6,6,5,.97); z-index:200; display:none; overflow:auto; -webkit-overflow-scrolling:touch;}
  .viewer.open{display:block;}
  .viewer img{display:block; width:100%; max-width:1100px; margin:0 auto; height:auto;}
  .viewer .vclose{position:fixed; top:14px; right:16px; z-index:201; background:rgba(10,10,9,.75); border:1px solid var(--line); color:var(--fg); font-size:26px; line-height:1; width:44px; height:44px; border-radius:50%; cursor:pointer;}
  .showcase .placeholder{font-family:'Fraunces',serif; font-style:italic; color:var(--faint); font-size:16px;}

  .info .collection{font-size:13px; color:var(--muted); margin-bottom:10px;}
  .info h1{font-family:'Fraunces',serif; font-weight:400; font-size:clamp(26px,3.4vw,34px); line-height:1.2; letter-spacing:-0.01em; max-width:18ch;}
  .price-row{display:flex; align-items:baseline; gap:14px; margin-top:22px;}
  .price-row .price{font-family:'Fraunces',serif; font-size:32px;}
  .price-row .bracket{font-size:12.5px; color:var(--faint); border:1px solid var(--line); padding:4px 9px;}

  .spec-list{margin-top:28px; border-top:1px solid var(--line-soft);}
  .spec-row{display:flex; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line-soft); font-size:14.5px;}
  .spec-row .k{color:var(--muted);}
  .spec-row .v{font-weight:500;}

  .desc{margin-top:28px;}
  .desc h4{font-size:12px; letter-spacing:.06em; color:var(--faint); margin-bottom:10px;}
  .desc p{color:var(--fg); font-size:15px; white-space:pre-wrap;}

  .cta-row{display:flex; gap:14px; margin-top:34px; flex-wrap:wrap;}
  .wa-btn{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--fg); color:var(--bg); padding:15px 26px; font-weight:600; font-size:15px; border-radius:2px;
    transition:transform .18s ease;
  }
  .wa-btn:hover{transform:translateY(-1px);}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--fg); padding:14px 22px; font-size:14.5px; border-radius:2px; transition:border-color .2s ease;}
  .btn-outline:hover{border-color:var(--fg);}

  .assurance{margin-top:30px; display:flex; gap:22px; flex-wrap:wrap; font-size:13px; color:var(--muted);}
  .assurance span{display:flex; align-items:center; gap:7px;}

  .not-found{padding:100px 0; text-align:center;}
  .not-found .big{font-family:'Fraunces',serif; font-style:italic; font-size:26px; margin-bottom:14px;}
  .not-found p{color:var(--muted); margin-bottom:24px;}

  @media (max-width:820px){
    .product{grid-template-columns:1fr; gap:30px; padding-top:20px;}
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html"><span class="word">Hisoka</span><span class="sub">STORE</span></a>
    <a class="btn-ghost" href="hisoka-store-account.html">Sign in</a>
  </div>
</header>

<div class="wrap breadcrumb">
  <a href="hisoka-store-catalog.html">← Back to catalog</a>
</div>

<div id="content"></div>

<div class="viewer" id="viewer"><button class="vclose" id="vclose" aria-label="Close">×</button><img id="viewerImg" alt=""></div>

<script>
const SUPABASE_URL = "https://fiydbqtjmfwkwkowztxq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_3_n9NFA3RROLTQyP5rHTVA_2eqNZvFI";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const WHATSAPP_NUMBER = "916009021896";

// Security: escape everything from the database before it becomes HTML, so a
// listing title/description can never run as script in a visitor's browser.
function escapeHtml(str){
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
function safeImageUrl(url){
  if (!url) return null;
  const trimmed = String(url).trim();
  if (!/^https?:\/\//i.test(trimmed)) return null;
  return trimmed.replace(/"/g, "%22").replace(/'/g, "%27");
}

const BRACKETS = [
  { label:"₹1k – 5k",    min:1000,   max:5000   },
  { label:"₹6k – 10k",   min:6000,   max:10000  },
  { label:"₹11k – 15k",  min:11000,  max:15000  },
  { label:"₹16k – 25k",  min:16000,  max:25000  },
  { label:"₹26k – 50k",  min:26000,  max:50000  },
  { label:"₹51k – 100k", min:51000,  max:100000 },
  { label:"₹101k – 500k",min:101000, max:500000 },
];
function bracketFor(price){
  if (price < BRACKETS[0].min) return BRACKETS[0].label;
  for (const b of BRACKETS){ if (price >= b.min && price <= b.max) return b.label; }
  return BRACKETS[BRACKETS.length - 1].label;
}

const params = new URLSearchParams(window.location.search);
const id = Number(params.get("id"));
const content = document.getElementById("content");

function renderNotFound(){
  content.innerHTML = `
    <div class="wrap not-found">
      <div class="big">This listing isn't around anymore</div>
      <p>It may have already sold or the link is out of date.</p>
      <a class="btn-ghost" style="border:1px solid var(--line); padding:12px 20px; border-radius:2px;" href="hisoka-store-catalog.html">Browse the catalog</a>
    </div>`;
}

function renderItem(item){
  const img = safeImageUrl(item.image_url);
  // The message carries a tappable link to this exact listing (full photo, price,
  // description) plus the raw photo link — so you always know which account they mean.
  const listingUrl = window.location.origin + window.location.pathname + "?id=" + Number(item.id);
  let msg = `Hi, I'm interested in this account:\n*${item.title}* — ₹${Number(item.price).toLocaleString('en-IN')}\nListing: ${listingUrl}`;
  if (img) msg += `\nPhoto: ${img}`;
  const waMessage = encodeURIComponent(msg);
  content.innerHTML = `
    <div class="wrap product">
      <div class="showcase${img ? " has-img" : ""}">
        <span class="tag">${escapeHtml(item.category)}</span>
        ${img
          ? `<img src="${img}" alt="${escapeHtml(item.title)}"><span class="zoom-hint">Tap to view full screen</span>`
          : `<span class="placeholder">Showcase image</span>`}
      </div>
      <div class="info">
        <div class="collection">${escapeHtml(item.collection)} · ${escapeHtml(item.category)}</div>
        <h1>${escapeHtml(item.title)}</h1>
        <div class="price-row">
          <span class="price">₹${Number(item.price).toLocaleString('en-IN')}</span>
          ${item.price_usd ? `<span class="price" style="font-size:20px; color:var(--muted);">· $${Number(item.price_usd).toLocaleString('en-US')}</span>` : ""}
          <span class="bracket">${bracketFor(item.price)}</span>
        </div>

        <div class="spec-list">
          <div class="spec-row"><span class="k">Category</span><span class="v">${escapeHtml(item.category)}</span></div>
          <div class="spec-row"><span class="k">Warranty</span><span class="v">${escapeHtml(item.warranty)}</span></div>
          <div class="spec-row"><span class="k">Delivery</span><span class="v">Handover over WhatsApp</span></div>
        </div>

        <div class="desc">
          <h4>ACCOUNT DESCRIPTION</h4>
          <p>${escapeHtml(item.description)}</p>
        </div>

        <div class="cta-row">
          <a class="wa-btn" href="https://wa.me/${WHATSAPP_NUMBER}?text=${waMessage}" target="_blank" rel="noopener noreferrer">Enquire on WhatsApp</a>
          <a class="btn-outline" href="hisoka-store-catalog.html">Back to catalog</a>
        </div>

        <div class="assurance">
          <span>🛡 ${escapeHtml(item.warranty)}</span>
          <span>🤝 Handed over by our team</span>
          <span>🏆 10,000+ IDs sold</span>
          <span>💳 UPI (₹) or Binance ($)</span>
        </div>
      </div>
    </div>`;

  const sc = document.querySelector(".showcase.has-img");
  if (sc){
    sc.addEventListener("click", () => {
      document.getElementById("viewerImg").src = img;
      document.getElementById("viewer").classList.add("open");
    });
  }
}

function closeViewer(){ document.getElementById("viewer").classList.remove("open"); }
document.getElementById("vclose").addEventListener("click", e => { e.stopPropagation(); closeViewer(); });
document.getElementById("viewer").addEventListener("click", closeViewer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeViewer(); });

(async () => {
  if (!id){ renderNotFound(); return; }
  const { data, error } = await sb.from("listings").select("*").eq("id", id).single();
  if (error || !data){ renderNotFound(); return; }
  renderItem(data);
})();
</script>

</body>
</html>
